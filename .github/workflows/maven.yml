name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & Test with Maven
        run: mvn -B verify
        working-directory: Pulselist

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/pulselist-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend/pulselist-frontend
        run: npm ci

      - name: Run React Tests
        working-directory: Frontend/pulselist-frontend
        run: npm test
      
      - name: Build frontend
        working-directory: Frontend/pulselist-frontend
        run: npm run build